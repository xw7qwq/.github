name: Feature request
description: Describe a use case and a proposed improvement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: Describe the outcome you want. Include examples or alternatives if useful.
    validations:
      required: true
