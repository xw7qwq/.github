name: Bug report
description: Report a reproducible failure or incorrect behavior
body:
  - type: textarea
    id: problem
    attributes:
      label: Actual and expected results
      description: Explain what went wrong and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction, relevant page, or public problem link.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include versions, operating system, browser, and relevant logs. Remove tokens, cookies, and sensitive personal data first.
